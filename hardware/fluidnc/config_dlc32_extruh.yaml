# FluidNC config: ExtruH H-bot pen plotter on MKS DLC32 V2.1
# Based on the config pulled from the board (hardware/fluidnc/config.yaml), with:
#   - Z changed from RC servo (gpio.22) to the stepper lever lift (hardware/pen-lift), Z socket
#   - X/Y sensorless homing: TMC2209 over UART + DIAG wired to the X/Y limit signal pins
#   - Z homing on a microswitch at the Z limit connector (gpio.34)
#
# UART pins: gpio.25 (TX) / gpio.26 (RX) are LCD-header pins (LCD not used with FluidNC).
# !! Confirm which header contacts they are before wiring (see README "Finding the UART pins").
#
# Bring-up:
#   1. Upload, reboot, $SS -> look for "TMC2209 ... driver test passed" for X and Y.
#      Failed = UART wiring / address wrong. Nothing below works until this passes.
#   2. Jog each axis, check directions.
#   3. Set stallguard_debug: true on one axis, $H, watch SG values, tune `stallguard`.

board: MKS-DLC32 V2.1
name: ExtruH pen plotter

kinematics:
  corexy: {}

stepping:
  engine: I2S_STATIC
  idle_ms: 255            # keep motors energised: if Z is released the spring drops the pen
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17

spi:
  miso_pin: gpio.12
  mosi_pin: gpio.13
  sck_pin: gpio.14

sdcard:
  cs_pin: gpio.15
  card_detect_pin: NO_PIN

uart1:
  txd_pin: gpio.25        # -> 1 kOhm -> PDN_UART bus
  rxd_pin: gpio.26        # -> PDN_UART bus directly
  baud: 115200
  mode: 8N1

axes:
  shared_stepper_disable_pin: i2so.0
  homing_runs: 1          # StallGuard: single fast pass

  # CoreXY/H-bot: X and Y must home in separate cycles.
  x:
    steps_per_mm: 80
    max_rate_mm_per_min: 10000
    acceleration_mm_per_sec2: 1500
    max_travel_mm: 320    # measure, then soft_limits: true
    soft_limits: false
    homing:
      cycle: 3
      positive_direction: false
      mpos_mm: 0
      seek_mm_per_min: 1500
      feed_mm_per_min: 1500
      settle_ms: 300
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_neg_pin: gpio.36       # X DIAG, active HIGH on stall (no :low)
      hard_limits: false
      pulloff_mm: 3
      tmc_2209:
        uart_num: 1
        addr: 0                    # MS1=GND, MS2=GND
        r_sense_ohms: 0.110
        run_amps: 0.8
        hold_amps: 0.5
        homing_amps: 0.5
        microsteps: 16
        stallguard: 40             # higher = triggers more easily
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        use_enable: false
        run_mode: StealthChop
        homing_mode: StallGuard
        step_pin: i2so.1
        direction_pin: i2so.2:low

  y:
    steps_per_mm: 80
    max_rate_mm_per_min: 10000
    acceleration_mm_per_sec2: 1500
    max_travel_mm: 380
    soft_limits: false
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0
      seek_mm_per_min: 1500
      feed_mm_per_min: 1500
      settle_ms: 300
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_neg_pin: gpio.35       # Y DIAG
      hard_limits: false
      pulloff_mm: 3
      tmc_2209:
        uart_num: 1
        addr: 1                    # MS1=VDD, MS2=GND
        r_sense_ohms: 0.110
        run_amps: 0.8
        hold_amps: 0.5
        homing_amps: 0.5
        microsteps: 16
        stallguard: 40
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        use_enable: false
        run_mode: StealthChop
        homing_mode: StallGuard
        step_pin: i2so.5
        direction_pin: i2so.6

  # Z = stepper pen lift. Units ~ mm of lever-tip travel (arm radius 28 mm):
  #   steps_per_mm = 3200 / (2*pi*28) = 18.19 at 1/16 microstep (set by the Z DIP switch)
  # Homes UP onto its microswitch first. Home = Z8, usable range Z-4 .. Z8.
  # Plotter G-code: G0 Z5 = pen up, G0 Z0 = pen down.
  z:
    steps_per_mm: 18.19
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 300
    max_travel_mm: 12
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 8
      seek_mm_per_min: 600
      feed_mm_per_min: 120
      settle_ms: 100
      seek_scaler: 1.5
      feed_scaler: 1.1
    motor0:
      limit_pos_pin: gpio.34:low   # NO microswitch to GND (same style as your old X/Y switches)
      hard_limits: false
      pulloff_mm: 1
      stepstick:                   # standalone TMC2209, no UART
        step_pin: i2so.3
        direction_pin: i2so.4

  # Old servo pen lift, kept for reference:
  # z:
  #   steps_per_mm: 10
  #   max_rate_mm_per_min: 5000
  #   acceleration_mm_per_sec2: 1000
  #   max_travel_mm: 10
  #   homing: { cycle: 1, positive_direction: true, mpos_mm: 5 }
  #   motor0:
  #     rc_servo: { pwm_hz: 50, output_pin: gpio.22, min_pulse_us: 1500, max_pulse_us: 1950 }

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: NO_PIN

macros:
  after_homing: G0 Z5      # park pen up

start:
  must_home: false
  check_limits: true

user_outputs:
  digital0_pin: I2SO.7
