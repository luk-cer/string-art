<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotter Preview</title>
<style>
:root{
  --bg:#f4f3f0; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e0db;
  --accent:#2f5bd3; --accent-ink:#fff; --paper:#ffffff; --desk:#d9d6cf; --travel:#e0452b;
  --danger:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17181a; --panel:#202124; --ink:#ececec; --muted:#9a9aa0; --line:#34353a;
         --accent:#7d9cff; --accent-ink:#0f1115; --desk:#0f1012; --danger:#ff8a80; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-columns:360px 1fr;grid-template-rows:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
aside .scroll{padding:14px 16px 90px;flex:1}
h1{font-size:15px;margin:0 0 12px;letter-spacing:.2px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent)}
#cropWrap{position:relative;margin-top:8px;display:none}
#cropCanvas{width:100%;border-radius:8px;cursor:move;touch-action:none;display:block}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit}
.seg button.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.row{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;margin:7px 0}
.row label{font-size:13px;display:flex;justify-content:space-between;gap:6px}
.row label small{color:var(--muted)}
.row input[type=range]{grid-column:1/2;width:100%;accent-color:var(--accent)}
.row input[type=number],.row select,.row input[type=text]{width:100%;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
.row.wide{grid-template-columns:1fr}
.info{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:50%;width:17px;height:17px;
  font:600 10px/1 system-ui,sans-serif;padding:0;margin-left:6px;cursor:pointer;flex:none;vertical-align:1px}
.info:hover,.info:focus-visible{color:var(--accent);border-color:var(--accent)}
.help{font-size:12px;line-height:1.45;color:var(--muted);background:var(--bg);border-radius:6px;padding:6px 8px;margin:-2px 0 6px}
.row label{align-items:center}
.row.sel{grid-template-columns:1fr 150px}
.row .stack{display:flex;flex-direction:column;gap:3px}
.check{display:flex;align-items:center;gap:8px;margin:7px 0}
textarea{width:100%;min-height:52px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px ui-monospace,monospace;padding:6px}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
details.grp{margin-top:6px}
details.grp summary{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
summary{cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 0}
.renderBar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .seg{grid-template-columns:repeat(3,auto)}
.toolbar .seg button{padding:5px 10px}
#stage{position:relative;overflow:hidden;background:var(--desk)}
#view{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#view.drag{cursor:grabbing}
#imgView{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:16px;padding:20px}
#imgView img{width:min(100%, calc(100vh - 190px));height:auto;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.2)}
#imgView figure{margin:0;flex:1;min-width:0;max-width:48%;text-align:center;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.18);color:#fff;font-weight:600;font-size:15px}
#busy span{background:rgba(0,0,0,.6);padding:10px 16px;border-radius:10px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:13px;align-items:center}
.stats b{font-variant-numeric:tabular-nums}
.stats .dl{margin-left:auto;display:flex;gap:6px}
.stats a{color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:6px}
.err{color:var(--danger);white-space:pre-wrap}
#anim{width:180px;accent-color:var(--accent)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px;pointer-events:none}
@media (max-width: 860px){
  body{grid-template-columns:1fr;grid-template-rows:auto 70vh}
  aside{border-right:0;border-bottom:1px solid var(--line);max-height:none}
}
</style>
</head>
<body>
<aside>
  <div class="scroll">
    <h1>Plotter preview</h1>

    <h2>Photo</h2>
    <div class="drop" id="drop">Drop a photo here or <u>choose a file</u>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div id="cropWrap">
      <canvas id="cropCanvas"></canvas>
      <div class="hint">Drag to move the square · drag its corner or scroll to resize · <a href="#" id="cropReset">auto</a></div>
    </div>

    <h2>Style</h2>
    <div class="seg" id="styleSeg">
      <button data-style="stringart" class="on">String art</button>
      <button data-style="hatch">Flow hatch</button>
      <button data-style="scribble">Scribble</button>
    </div>

    <h2>Paper &amp; pen</h2>
    <div id="commonParams"></div>

    <h2 id="styleTitle">String art</h2>
    <div id="styleParams"></div>

    <details id="profileBox">
      <summary>Plotter profile (G-code)</summary>
      <div id="profileParams"></div>
      <div class="row wide"><div class="stack"><label>Header lines</label><textarea id="pf_header"></textarea></div></div>
      <div class="row wide"><div class="stack"><label>Footer lines</label><textarea id="pf_footer"></textarea></div></div>
      <button class="btn ghost" id="profileReset" type="button">Reset profile</button>
    </details>
  </div>
  <div class="renderBar">
    <button class="btn" id="renderBtn" disabled>Render</button>
    <label class="check" style="margin:0"><input type="checkbox" id="auto"> auto</label>
    <button class="btn ghost" id="resetParams" type="button" style="margin-left:auto">Defaults</button>
  </div>
</aside>

<main>
  <div class="toolbar">
    <div class="seg" id="viewSeg">
      <button data-view="plot" class="on">Plot</button>
      <button data-view="target">Target</button>
      <button data-view="sim">Simulation</button>
    </div>
    <label class="check"><input type="checkbox" id="showTravel"> travel moves</label>
    <label class="check"><input type="checkbox" id="showNails"> rim</label>
    <span style="display:flex;align-items:center;gap:6px">
      <button class="btn ghost" id="play" type="button" style="padding:4px 10px">▶</button>
      <input type="range" id="anim" min="0" max="1000" value="1000" aria-label="plot progress">
      <small id="animLabel" style="color:var(--muted);min-width:60px"></small>
    </span>
    <button class="btn ghost" id="fit" type="button" style="padding:4px 10px">Fit</button>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="imgView">
      <figure><img id="imgTarget" alt="target"><figcaption>target (what we aim for)</figcaption></figure>
      <figure><img id="imgSim" alt="simulation"><figcaption>simulation (what the solver drew)</figcaption></figure>
    </div>
    <div class="empty" id="empty">Upload a photo, pick a style, press <b>&nbsp;Render</b>.</div>
    <div id="busy"><span id="busyText">Rendering…</span></div>
  </div>
  <div class="stats" id="stats"><span style="color:var(--muted)">No render yet.</span></div>
</main>

<script>
"use strict";
// ---------------------------------------------------------------- parameters
const COMMON = [
  {k:"paper", label:"Paper", type:"select", opts:["A4","A3","A5","A6","Letter","Legal"], v:"A4"},
  {k:"portrait", label:"Portrait orientation", type:"check", v:false, not:["radon"]},
  {k:"pen_mm", label:"Pen width", unit:"mm", min:0.05, max:1.0, step:0.05, v:0.3},
  {k:"padding_mm", label:"Padding", unit:"mm", min:0, max:40, step:1, v:10},
  {k:"diameter_mm", label:"Diameter (0 = fit)", unit:"mm", min:0, max:400, step:5, v:0, not:["radon","scribble"]},
];
// What each setting does. Key "style:param" overrides plain "param".
const HELP = {
  // paper & pen
  paper: "Paper size the drawing is fitted to.",
  portrait: "Turn the paper upright (tall) instead of landscape.",
  pen_mm: "Your pen's line width. The algorithms model real ink with it: a wider pen reaches darkness with fewer lines.",
  padding_mm: "Blank margin kept around the drawing on every side.",
  diameter_mm: "Circle size. 0 = the largest circle that fits inside the padding.",

  // string art
  nails: "Points around the circle that lines run between. More nails = finer angles and detail, slower to compute.",
  max_lines: "Upper limit on the number of lines. The solver usually stops earlier, when no line improves the picture.",
  _suggest: "Tries combinations of the tone settings below, solves each, and keeps the one whose simulated plot looks most like the photo (structure and tone at viewing distance). Takes 1-3 minutes; then renders.",
  chords: "straight = classic chords. poincare = hyperbolic arcs that meet the rim at right angles and bow towards the centre. warp = the solver picks straight or a bend for each line (best likeness, about 5x slower).",
  dashed: "Lines fade out where the photo is light: solid in dark areas, then ever shorter and sparser dashes, then nothing. Much better likeness, but every dash is a pen lift (many more lifts, longer plots).",
  gap_tone: "Dashed lines: below this darkness the line is blank.",
  taper: "Dashed lines: darkness range over which dashes grow from nothing to a solid line. 0 = hard cut (looks like a stencil); 0.3 = gentle fade.",
  dash_period_mm: "Dashed lines: length of one dash plus its gap. The dash's share follows the tone. Longer = fewer pen lifts, coarser texture.",
  dash_min_mm: "Dashed lines: drop dashes shorter than this (avoids pen stutter).",
  gap_min_mm: "Dashed lines: don't lift the pen for gaps shorter than this.",
  hatch_walls: "Hatch lines stop at contour lines: major = silhouettes and big shape edges, all = every contour line, none = hatch across.",
  hatch_major_px: "Scale at which an edge counts as major. 4 = big shapes, 6 = mostly the silhouette.",
  min_lines: "Keep drawing the best available line until this many, even after the tone target is reached. Use when it stops too early; the result gets darker than the photo.",
  overshoot: "How strongly ink on areas lighter than the photo is penalised. Higher = cleaner highlights but fewer lines; lower = denser, darker.",
  pixel_mm: "Size of the area the eye blends together (viewing distance). Larger = smoother tones and more lines before an area counts as done.",
  max_darkness: "How dark the darkest photo tone is aimed for (1 = solid ink). Higher = more lines in dark areas.",
  gamma: "Midtone curve. Above 1 lightens midtones (fewer lines), below 1 darkens them (more lines).",
  contrast_clip: "Auto-contrast: ignore this percent of the darkest and lightest pixels when stretching the tones.",
  clahe: "Local contrast boost. Brings out eyes and mouth in flat photos; too much turns noisy. 0 = off.",
  edge_boost: "Extra weight on edges, so lines favour outlines and features over flat areas.",
  vignette: "Fade the target to white towards the rim. Helps with busy backgrounds.",
  stop_ratio: "Stop once the best line helps less than this fraction of the first line. 0 = never stop early for this reason.",
  min_skip: "Smallest gap (in nails) a line may span. Prevents short chords hugging the rim.",
  nail_spread_mm: "Each visit to a nail lands at a slightly different point on the rim, so line ends don't pool into ink blobs.",
  continuous: "One unbroken line, like real thread. Off = the pen lifts and restarts where it helps most.",
  frame: "Also draw the circle outline.",

  // flow hatch
  flow: "Stroke direction. contour = along shapes (wraps around the face), gradient = across shapes, fixed = straight classic hatching.",
  flow_smooth_mm: "How much the direction field is smoothed. Bigger = calmer, broader curves; smaller = follows more detail.",
  flow_bias_angle: "Direction used where the image is flat, and the angle for fixed hatching.",
  layers: "How many crossing hatch layers. Each darker tone level adds one more direction.",
  t1: "Darkness (0 = white, 1 = black) where the first layer starts.",
  t2: "Darkness where the second, crossing layer starts.",
  t3: "Darkness where the third (diagonal) layer starts.",
  t4: "Darkness where the fourth layer starts.",
  spacing_max_mm: "Line spacing where a layer fades in (lightest).",
  spacing_min_mm: "Line spacing in the darkest areas. 0 = 2.5 x pen width, so dark areas don't merge into solid black.",
  "hatch:gamma": "Midtone curve. Above 1 lightens midtones, below 1 darkens them.",
  "hatch:clahe": "Local contrast boost. 0 = off.",
  tone_smooth_mm: "Blur on the map that switches layers on. Softer layer edges and fewer stubs; 0 = crisp tone edges.",

  seed_margin: "Lines only start this much darker than the layer threshold. Fewer short stubs at layer edges.",
  min_len_mm: "Drop strokes shorter than this.",

  rotate: "auto = turn the image 90 degrees when it fills the page better.",
  "scribble:shape": "rect = whole image. circle = centred square crop, everything clipped to the inscribed circle.",
  "scribble:frame": "Circle shape: also draw the circle outline.",
  white_cut: "Areas lighter than this share of the tonal range stay blank paper (app presets use 0.2).",
  remove_noise: "Non-local-means denoise before tracing. Cleaner lines on grainy photos; slow on big images.",
  main_lines: "Trace the contour lines that follow the image's iso-brightness lines. Off = tone layer only.",
  gradient_threshold: "Ignore gradients weaker than this. Higher = contour lines only on stronger edges.",
  cleanup_mode: "How much space is cleared around each traced line. adaptive (c_v25) = circles sized by tone and texture; quadrant (app5/7) = boxes sized by the darkest nearby pixel.",
  cleanup_radius: "Maximum gap cleared around a line (px). Bigger = sparser contour lines.",
  max_lines: "Maximum number of contour lines traced.",
  "scribble:max_lines": "Maximum number of contour lines traced.",
  main_max_steps: "Longest a single contour line may run, in pixels.",
  main_momentum: "Blends each step with the previous direction. 0.5 = calmer contours without wobbles; 0.8+ starts cutting corners.",
  smooth_main: "Moving-average smoothing of contour lines in points. 3 removes the pixel staircase. 0 = off.",
  light_percentile: "Percentile that defines 'light' for the adaptive spacing rule.",
  trace_kernel_size: "Radius of the area the tracer looks at to decide where to go and of the gradient blur.",
  trace_kernel_sigma: "Blur strength for the traced gradient. Higher = smoother contour lines.",
  hatch: "Draw a tone layer (hatching or scribble) on top of the contour lines.",
  hatch_mode: "legacy = your original hatching. clean = evenly spaced, no U-turns or clumps. ink = clean, but only adds darkness the contour lines haven't drawn. freehand = hand-like looping scribble. squiggle = experimental maze curve.",
  hatch_angles: "Hatch directions relative to the image's gradient, each with the darkness where it starts: angle:darkness, comma separated.",
  hatch_sample_interval: "Distance between hatch starting points along each contour line.",
  hatch_adaptive_spacing: "Start hatch lines more often in darker areas.",
  "scribble:hatch_max_length": "Longest hatch stroke in pixels.",
  hatch_source: "Which contour lines hatching starts from: all, the 1000 longest (app5), or merged lines (app7).",
  hatch_min_line_length: "Only start hatching from contour lines longer than this.",
  hatch_keep_min: "Drop hatch lines with fewer points than this.",
  hatch_patch: "Look-ahead radius when hatching. 0 = same as the trace kernel; app5/7 used 5.",
  hatch_spacing_min_px: "Spacing between hatch lines in the darkest areas.",
  hatch_spacing_max_px: "Spacing where a hatch direction fades in.",
  hatch_threshold_shift: "Start every hatch direction at a lighter (negative) or darker (positive) tone than its listed darkness.",
  hatch_max_turn_deg: "A hatch line stops after turning this much in total. Prevents spirals.",
  hatch_clean_min_len: "Drop hatch strokes shorter than this.",
  hatch_flow_smooth_px: "Smoothing of the direction field the tone layer follows. Bigger = calmer directions.",
  hatch_fill_px: "Flat areas with no gradient borrow their direction from structure this far away, so strokes wrap around shapes. 0 = off.",
  hatch_view_px: "Blur at which ink and photo are compared (viewing distance). Bigger = judged from further away.",
  hatch_ink_passes: "1 = one pass, lighter. 2 = measure the density actually reached and correct it, matching the photo's tone better.",
  freehand_density: "Share of the missing darkness the scribble draws. 1 = full tone; lower = lighter, airier.",
  freehand_loop_min: "Loop radius in the darkest areas. Too small makes rope-like dark bands.",
  freehand_loop_max: "Loop radius in light areas.",
  freehand_advance: "How fast the loop centre travels compared with the pen. Lower = denser, more overlapping loops.",
  freehand_momentum: "Inertia of turning. Higher = longer smooth arcs; lower = twitchier path.",
  freehand_noise: "Random turning of the path. Higher breaks up parallel bands.",
  freehand_wobble: "Random variation of loop size, speed and shape. 0 = mechanical spring.",
  freehand_tone_jitter: "How randomly the hand chooses which nearby dark area to head for. 0 = always the average direction (can make bands).",

  squiggle_min_cell: "Smallest maze cell (darkest tone). 0 = automatic, about 4 pen widths.",
  squiggle_max_cell: "Largest maze cell (lightest drawn tone).",
  squiggle_white: "Areas needing less darkness than this stay blank.",
  squiggle_flow_bias: "0 = random maze; higher = corridors follow the image flow (3+ = straight rows).",
  squiggle_angle: "Corridor direction relative to the contours.",
  squiggle_smooth: "Rounds the maze corners.",

  separable_blur: "Faster blur for hatching. Same result within rounding.",
  workers: "Processes used for legacy hatching. 0 = all cores.",

  // plotter profile
  pen_up: "G-code that lifts the pen.",
  pen_down: "G-code that lowers the pen.",
  dwell_s: "Pause after every pen up or down (G4), in seconds, so the pen settles.",
  draw_feed: "Drawing speed (G1 feed rate).",
  travel_feed: "Speed of pen-up moves. 0 = the machine's rapid speed.",
  decimals: "Digits after the decimal point in coordinates.",
  flip_y: "Flip the drawing vertically for plotters with the origin at the bottom left.",
  offset_x: "Shift the whole drawing right (mm).",
  offset_y: "Shift the whole drawing up (mm).",
  pause_every_mm: "Insert an M0 pause after this much drawing, to check or swap the pen. 0 = never.",
  pen_move_s: "How long a pen up or down takes. Only used for the plot time estimate.",

const STYLE_PARAMS = {
  stringart: [
    {k:"_suggest", label:"Suggest settings for this photo", type:"button", action:"suggest"},
    {k:"nails", label:"Nails", min:60, max:400, step:4, v:240},
    {k:"max_lines", label:"Max lines", min:100, max:8000, step:100, v:3000},
    {k:"min_lines", label:"Draw at least (0 = stop when done)", min:0, max:8000, step:100, v:0},
    {k:"stop_ratio", label:"Stop when gain falls below", min:0, max:0.2, step:0.005, v:0},
    {k:"overshoot", label:"Highlight protection", hint:"overshoot", min:0.5, max:10, step:0.5, v:3},
    {k:"pixel_mm", label:"Viewing cell", unit:"mm", min:0.4, max:3, step:0.1, v:1.2},
    {k:"max_darkness", label:"Darkest tone aimed for", min:0.3, max:1, step:0.05, v:0.9},
    {k:"gamma", label:"Gamma", min:0.4, max:3, step:0.05, v:1.0},
    {k:"contrast_clip", label:"Auto-contrast clip", unit:"%", min:0, max:10, step:0.5, v:1},
    {k:"clahe", label:"Local contrast", min:0, max:0.08, step:0.005, v:0},
    {k:"edge_boost", label:"Edge emphasis", min:0, max:5, step:0.25, v:1},

// ---------------------------------------------------------------- controls
const $ = id => document.getElementById(id);

function helpFor(p){ return HELP[S.style + ":" + p.k] ?? HELP[p.k] ?? ""; }
function withHelp(w, p){
  const h = helpFor(p);
  if(!h) return w;
  w.title = h;
  const lab = w.querySelector("label") || w;
  const b = document.createElement("button");
  b.type = "button"; b.className = "info"; b.textContent = "?"; b.setAttribute("aria-label", "What does " + p.label + " do?");
  const box = document.createElement("div"); box.className = "help"; box.textContent = h; box.hidden = true;
  b.onclick = e => { e.preventDefault(); e.stopPropagation(); box.hidden = !box.hidden; };
  (lab.tagName === "LABEL" && w.className !== "check" ? lab : w).appendChild(b);
  const outer = document.createElement("div"); outer.className = "ctl"; outer.appendChild(w); outer.appendChild(box);
  return outer;
}
function control(p, values, onChange){ return withHelp(control0(p, values, onChange), p); }
function control0(p, values, onChange){
  const id = "p_" + Math.random().toString(36).slice(2);
  if(p.type === "button"){
    const w = document.createElement("div"); w.className = "row wide";
    w.innerHTML = `<button class="btn ghost" type="button" id="${id}">${p.label}</button>`;
    w.querySelector("button").onclick = () => ACTIONS[p.action]();
    return w;
  }
  if(p.type === "check"){
    const w = document.createElement("label"); w.className = "check";
    w.innerHTML = `<input type="checkbox" id="${id}"> ${p.label}`;
    const c = w.querySelector("input"); c.checked = !!values[p.k];
    c.onchange = () => { values[p.k] = c.checked; onChange(); if(p.rebuild) buildControls(); };
    return w;
  }
  const w = document.createElement("div"); w.className = "row";
  if(p.type === "select" || p.type === "text"){
    w.className = "row sel";
    w.innerHTML = `<label for="${id}">${p.label}</label>`;
    const el = document.createElement(p.type === "select" ? "select" : "input");
    el.id = id;
    if(p.type === "select") el.innerHTML = p.opts.map(o => `<option>${o}</option>`).join("");
    else el.type = "text";
    el.value = values[p.k];
    el.onchange = () => { values[p.k] = el.value;
      if(p.apply) { applyPreset(el.value); return; }
      if(p.recrop && S.image){ cropForStyle(); setCropView(); drawCrop(); }
      onChange(); if(p.rebuild) buildControls(); };
    w.appendChild(el);
    return w;
  }
  w.innerHTML = `<div class="stack"><label for="${id}">${p.label}<small>${p.unit||""}</small></label>
    <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" id="${id}"></div>
    <input type="number" min="${p.min}" max="${p.max}" step="${p.step}" aria-label="${p.label}">`;
  const r = w.querySelector("input[type=range]"), n = w.querySelector("input[type=number]");
  r.value = n.value = values[p.k];
  r.oninput = () => { n.value = r.value; };
  r.onchange = () => { values[p.k] = +r.value; onChange(); };
  n.onchange = () => { r.value = n.value; values[p.k] = +n.value; onChange(); };
  return w;
}

function buildControls(){
  const c = $("commonParams"); c.innerHTML = "";
  COMMON.filter(p => !(p.not||[]).includes(S.style))
        .forEach(p => c.appendChild(control(p, S.common, changed)));
  const s = $("styleParams"); s.innerHTML = "";
  const P = S.params[S.style];
  let box = s, groupVisible = true;
  const openState = store.get("groups", {});
  for(const p of STYLE_PARAMS[S.style]){
    if(p.group){                                   // collapsible section, hidden when not relevant
      groupVisible = !p.when || p.when(P);
      if(!groupVisible) continue;
      const d = document.createElement("details"); d.className = "grp";
      const key = S.style + ":" + p.group;
      d.open = key in openState ? openState[key] : !p.closed;
      d.ontoggle = () => { const o = store.get("groups", {}); o[key] = d.open; store.set("groups", o); };
      d.innerHTML = `<summary>${p.group}</summary>`;
      s.appendChild(d); box = d;
      continue;
    }
    if(!groupVisible || (p.when && !p.when(P))) continue;
    box.appendChild(control(p, P, changed));
  }
  $("styleTitle").textContent = {stringart:"String art", hatch:"Flow hatch", scribble:"Scribble"}[S.style];
  const pf = $("profileParams"); pf.innerHTML = "";
  PROFILE.forEach(p => pf.appendChild(control(p, S.profile, changedProfile)));
  $("pf_header").value = S.profile.header; $("pf_footer").value = S.profile.footer;
  document.querySelectorAll("#styleSeg button").forEach(b => b.classList.toggle("on", b.dataset.style === S.style));
}

let _presets = null;
const KEEP_ON_PRESET = ["preset","max_side","rotate","shape","frame","workers","seed","simplify_px","join_px",
  "hatch_mode","main_lines","freehand_density","freehand_loop_min","freehand_loop_max","freehand_advance",
  "freehand_momentum","freehand_noise","freehand_tone_jitter","freehand_wobble","freehand_flow_pull","freehand_stroke_px","freehand_walls","freehand_major_px","hatch_view_px","hatch_ink_passes","hatch_spacing_min_px","hatch_spacing_max_px","hatch_fill_px","hatch_max_turn_deg","main_momentum","smooth_main"];
async function applyPreset(name){
  try{
    if(!_presets) _presets = await (await fetch("/api/presets/scribble")).json();
    const v = {..._presets.defaults, ...(_presets.presets[name] || {})};
    const P = S.params.scribble;
    for(const p of STYLE_PARAMS.scribble){
      if(!p.k || KEEP_ON_PRESET.includes(p.k) || !(p.k in v)) continue;
      let x = v[p.k];
      if(p.k === "hatch_angles") x = x.map(a => a.join(":")).join(",");
      else if(x === null) x = p.type === "text" ? "" : 0;
      else if(p.type === "text") x = String(x);
      P[p.k] = x;
    }
    P.preset = name;
    persist(); buildControls(); changed();
  }catch(e){ $("stats").innerHTML = `<span class="err">Preset load failed: ${e.message}</span>`; }
}
function persist(){
  store.set("style", S.style); store.set("common", S.common);
  store.set("params."+S.style, S.params[S.style]); store.set("profile", S.profile);
}

document.querySelectorAll("#styleSeg button").forEach(b => b.onclick = () => {
  const wasFree = freeCrop(); S.style = b.dataset.style; persist(); buildControls();
  if(S.image){ if(wasFree !== freeCrop()){ cropForStyle(); setCropView(); } drawCrop(); } changed();
});

// ---------------------------------------------------------------- upload + crop
const drop = $("drop"), file = $("file");
drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if(e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
file.onchange = () => file.files[0] && upload(file.files[0]);

const cropImg = new Image();
async function upload(f){
  drop.textContent = "Uploading…";
  try{
    const r = await fetch("/api/upload", {method:"POST", body:f, headers:{"X-Filename":encodeURIComponent(f.name)}});
    const j = await r.json(); if(!r.ok) throw new Error(j.error);
    S.image = j; cropForStyle(); setCropView();
    cropImg.onload = () => { $("cropWrap").style.display = "block"; drawCrop(); };
    cropImg.src = j.url;
    drop.innerHTML = `${f.name} — <u>change</u>`;
    $("renderBtn").disabled = false;
    if($("auto").checked) render();
  }catch(e){ drop.innerHTML = `<span class="err">Upload failed: ${e.message}</span>`; }
}

const cc = $("cropCanvas"), cx = cc.getContext("2d");
let cropScale = 1, cropView = [0,0,1,1];
function setCropView(){
  // show the part of the image that has content (e.g. a small photo on a big white canvas)
  let [x0,y0,x1,y1] = S.image.content;
  if(S.crop){ x0 = Math.min(x0, S.crop[0]); y0 = Math.min(y0, S.crop[1]);
              x1 = Math.max(x1, S.crop[0]+S.crop[2]); y1 = Math.max(y1, S.crop[1]+S.crop[3]); }
  const pad = 0.08 * Math.max(x1-x0, y1-y0);
  const vx0 = Math.max(0, x0-pad), vy0 = Math.max(0, y0-pad);
  cropView = [vx0, vy0, Math.min(S.image.width, x1+pad) - vx0, Math.min(S.image.height, y1+pad) - vy0];
}
function drawCrop(){
  const W = cc.clientWidth || 320, dpr = window.devicePixelRatio || 1;
  const [vx0, vy0, vw, vh] = cropView;
  cropScale = W / vw;
  const H = Math.min(vh * cropScale, 420);
  cc.width = W*dpr; cc.height = H*dpr; cc.style.height = H+"px";
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.fillStyle = "#777"; cx.fillRect(0,0,W,H);
  cx.save(); cx.translate(-vx0*cropScale, -vy0*cropScale);
  cx.drawImage(cropImg, 0, 0, S.image.width*cropScale, S.image.height*cropScale);
  cx.restore();
  const [x,y,w,h] = [(S.crop[0]-vx0)*cropScale, (S.crop[1]-vy0)*cropScale, S.crop[2]*cropScale, S.crop[3]*cropScale];
  cx.fillStyle = "rgba(0,0,0,.55)";
  cx.beginPath(); cx.rect(0,0,W,H);
  const isCircle = !freeCrop() && !(S.style === "hatch" && S.params.hatch.shape === "rect");
  if(isCircle) cx.arc(x+w/2, y+w/2, w/2, 0, Math.PI*2, true); else cx.rect(x+w, y, -w, h);
  cx.fill("evenodd");
  cx.strokeStyle = "#fff"; cx.lineWidth = 1.5; cx.strokeRect(x, y, w, h);
  cx.fillStyle = "#fff"; cx.fillRect(x+w-7, y+h-7, 10, 10);
}
// square crop for circle styles, free rectangle for scribble
function freeCrop(){ return S.style === "scribble" && S.params.scribble.shape !== "circle"; }
function clampCrop(){
  const iw = S.image.width, ih = S.image.height;
  let [x,y,w,h] = S.crop;
  if(freeCrop()){ w = Math.max(16, Math.min(w, iw)); h = Math.max(16, Math.min(h, ih)); }
  else { w = Math.max(16, Math.min(w, iw, ih)); h = w; }
  x = Math.max(0, Math.min(x, iw-w)); y = Math.max(0, Math.min(y, ih-h));
  S.crop = [Math.round(x), Math.round(y), Math.round(w), Math.round(h)];
}
function cropForStyle(){
  if(!S.image) return;
  if(freeCrop()) S.crop = [0, 0, S.image.width, S.image.height];
  else S.crop = S.image.crop.slice();
}
let dragMode = null, dragStart = null;
cc.onpointerdown = e => {
  const r = cc.getBoundingClientRect(), px = (e.clientX-r.left)/cropScale + cropView[0], py = (e.clientY-r.top)/cropScale + cropView[1];
  const [x,y,w,h] = S.crop, corner = 14/cropScale;
  dragMode = (Math.abs(px-(x+w)) < corner && Math.abs(py-(y+h)) < corner) ? "resize" : "move";
  dragStart = {px, py, crop:S.crop.slice()}; cc.setPointerCapture(e.pointerId);
};
cc.onpointermove = e => {
  if(!dragMode) return;
  const r = cc.getBoundingClientRect(), px = (e.clientX-r.left)/cropScale + cropView[0], py = (e.clientY-r.top)/cropScale + cropView[1];
  const [x,y,w,h] = dragStart.crop;
  if(dragMode === "move") S.crop = [x + px - dragStart.px, y + py - dragStart.py, w, h];
  else if(freeCrop()) S.crop = [x, y, px-x, py-y];
  else { const s = Math.max(px-x, py-y); S.crop = [x, y, s, s]; }
  clampCrop(); drawCrop();
};
cc.onpointerup = () => { if(dragMode){ dragMode = null; changed(); } };
cc.onwheel = e => {
  e.preventDefault();
  const [x,y,w,h] = S.crop, f = e.deltaY > 0 ? 1.05 : 0.95, nw = w*f, nh = h*f;
  S.crop = [x - (nw-w)/2, y - (nh-h)/2, nw, nh]; clampCrop(); drawCrop();
  clearTimeout(autoTimer); autoTimer = setTimeout(changed, 400);
};
$("cropReset").onclick = e => { e.preventDefault(); if(S.image){ cropForStyle(); setCropView(); drawCrop(); changed(); } };
window.addEventListener("resize", () => { if(S.image) drawCrop(); draw(); });

// ---------------------------------------------------------------- suggest (string art)
const ACTIONS = {
  async suggest(){
    if(!S.image){ $("stats").innerHTML = `<span class="err">Upload a photo first.</span>`; return; }
    $("busy").style.display = "flex"; $("busyText").textContent = "Optimising settings (1-3 min)…";
    try{
      const r = await fetch("/api/suggest", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({image:S.image.id, crop:S.crop, params:{...S.common, ...S.params.stringart}})});
      const j = await r.json(); if(!r.ok) throw new Error(j.error);
      Object.assign(S.params.stringart, j.params); persist(); buildControls();
      const steps = j.history.slice(1).map(h => h.step).join(", ") || "current settings were already best";
      $("busy").style.display = "none";
      await render();
      $("stats").insertAdjacentHTML("afterbegin", `<span>suggested: <b>${steps}</b> (score ${j.score})</span>`);
    }catch(e){ $("stats").innerHTML = `<span class="err">Suggest failed: ${e.message}</span>`; }
    finally{ $("busy").style.display = "none"; $("busyText").textContent = "Rendering…"; }
  },
};

// ---------------------------------------------------------------- render
let renderSeq = 0;
async function render(){
  if(!S.image) return;
  const seq = ++renderSeq;
  $("busy").style.display = "flex"; $("renderBtn").disabled = true;
  const t0 = performance.now();
  const tick = setInterval(() => { $("busyText").textContent = `Rendering… ${((performance.now()-t0)/1000).toFixed(0)} s`; }, 500);
  const params = {...S.common, ...S.params[S.style]};
  const profile = {...S.profile,
    header: S.profile.header.split("\n").filter(Boolean),
    footer: S.profile.footer.split("\n").filter(Boolean)};
  try{
    const r = await fetch("/api/render", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({image:S.image.id, crop:S.crop, style:S.style, params, profile})});
    const j = await r.json(); if(!r.ok) throw new Error(j.error);
    if(seq !== renderSeq) return;
    S.result = j; $("anim").value = 1000; $("empty").style.display = "none";
    showStats(); setView(S.view); fit();
  }catch(e){
    $("stats").innerHTML = `<span class="err">${e.message}</span>`;
  }finally{
    clearInterval(tick); $("busyText").textContent = "Rendering…";
    if(seq === renderSeq){ $("busy").style.display = "none"; $("renderBtn").disabled = false; }
  }
}
$("renderBtn").onclick = render;

function fmtMin(m){ return m >= 90 ? (m/60).toFixed(1)+" h" : Math.round(m)+" min"; }
function showStats(){
  const s = S.result.stats, f = S.result.files, parts = [];
  if(s.lines != null) parts.push(`<span>lines <b>${s.lines}</b></span>`);
  parts.push(`<span>pen lifts <b>${s.pen_lifts}</b></span>`);
  parts.push(`<span>ink <b>${(s.draw_mm/1000).toFixed(1)} m</b></span>`);
  parts.push(`<span>travel <b>${(s.travel_mm/1000).toFixed(1)} m</b></span>`);
  parts.push(`<span>plot time ≈ <b>${fmtMin(s.est_minutes)}</b></span>`);
  parts.push(`<span style="color:var(--muted)">computed in ${s.seconds}s</span>`);
  parts.push(`<span class="dl"><a href="${f.gcode}" download>G-code</a><a href="${f.svg}" download>SVG</a><a href="${f.json}" download>JSON</a></span>`);
  $("stats").innerHTML = parts.join("");
}

// ---------------------------------------------------------------- preview canvas
const view = $("view"), vx = view.getContext("2d");
const cam = {scale:1, ox:0, oy:0};   // screen = mm*scale + o
function fit(){
  if(!S.result) return;
  const r = view.getBoundingClientRect(), {w,h} = S.result.paper, m = 24;
  cam.scale = Math.min((r.width-2*m)/w, (r.height-2*m)/h);
  cam.ox = (r.width - w*cam.scale)/2; cam.oy = (r.height - h*cam.scale)/2;
  draw();
}
$("fit").onclick = fit;

function draw(){
  const r = view.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if(view.width !== Math.round(r.width*dpr) || view.height !== Math.round(r.height*dpr)){
    view.width = Math.round(r.width*dpr); view.height = Math.round(r.height*dpr);
  }
  vx.setTransform(1,0,0,1,0,0); vx.clearRect(0,0,view.width,view.height);
  if(!S.result) return;
  vx.setTransform(dpr*cam.scale,0,0,dpr*cam.scale,dpr*cam.ox,dpr*cam.oy);
  const {w,h} = S.result.paper, pls = S.result.polylines;
  vx.fillStyle = "#fff"; vx.shadowColor = "rgba(0,0,0,.25)"; vx.shadowBlur = 12;
  vx.fillRect(0,0,w,h); vx.shadowBlur = 0;

  const total = pls.length, upto = Math.round(total * $("anim").value / 1000);
  $("animLabel").textContent = upto < total ? `${upto} / ${total}` : "";

  if($("showNails").checked && S.result.stats.crop_box){
    // rim guide (circle styles): largest inscribed circle of the drawing
    vx.strokeStyle = "rgba(47,91,211,.5)"; vx.lineWidth = 0.6/cam.scale; vx.setLineDash([2,2]);
    const b = bounds(); vx.beginPath();
    vx.arc((b[0]+b[2])/2, (b[1]+b[3])/2, Math.max(b[2]-b[0], b[3]-b[1])/2, 0, Math.PI*2); vx.stroke(); vx.setLineDash([]);
  }

  vx.strokeStyle = "#111"; vx.lineCap = "round"; vx.lineJoin = "round";
  vx.lineWidth = S.result.pen_mm;     // true pen width in mm
  vx.beginPath();
  for(let i=0;i<upto;i++){
    const p = pls[i]; vx.moveTo(p[0], p[1]);
    for(let k=2;k<p.length;k+=2) vx.lineTo(p[k], p[k+1]);
  }
  vx.stroke();

  if($("showTravel").checked){
    vx.strokeStyle = "rgba(224,69,43,.7)"; vx.lineWidth = 0.8/cam.scale; vx.setLineDash([3/cam.scale, 3/cam.scale]);
    vx.beginPath(); let last = [0,0];
    for(let i=0;i<upto;i++){
      const p = pls[i];
      if(Math.hypot(p[0]-last[0], p[1]-last[1]) > 0.01){ vx.moveTo(last[0], last[1]); vx.lineTo(p[0], p[1]); }
      last = [p[p.length-2], p[p.length-1]];
    }
    vx.stroke(); vx.setLineDash([]);
  }
  if(upto > 0 && upto < total){   // pen position marker
    const p = pls[upto-1];
    vx.fillStyle = "#e0452b"; vx.beginPath();
    vx.arc(p[p.length-2], p[p.length-1], 4/cam.scale, 0, Math.PI*2); vx.fill();
  }
}
let _bounds = null, _boundsFor = null;
function bounds(){
  if(_boundsFor === S.result) return _bounds;
  let b = [Infinity,Infinity,-Infinity,-Infinity];
  for(const p of S.result.polylines) for(let k=0;k<p.length;k+=2){
    b[0]=Math.min(b[0],p[k]); b[1]=Math.min(b[1],p[k+1]); b[2]=Math.max(b[2],p[k]); b[3]=Math.max(b[3],p[k+1]);
  }
  _bounds = b; _boundsFor = S.result; return b;
}

// zoom / pan
view.onwheel = e => {
  e.preventDefault(); if(!S.result) return;
  const r = view.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0015), ns = Math.min(200, Math.max(0.2, cam.scale*f));
  cam.ox = mx - (mx - cam.ox) * ns/cam.scale; cam.oy = my - (my - cam.oy) * ns/cam.scale; cam.scale = ns; draw();
};
let pan = null;
view.onpointerdown = e => { pan = {x:e.clientX, y:e.clientY, ox:cam.ox, oy:cam.oy}; view.classList.add("drag"); view.setPointerCapture(e.pointerId); };
view.onpointermove = e => { if(!pan) return; cam.ox = pan.ox + e.clientX - pan.x; cam.oy = pan.oy + e.clientY - pan.y; draw(); };
view.onpointerup = () => { pan = null; view.classList.remove("drag"); };
view.ondblclick = fit;

["showTravel","showNails"].forEach(id => $(id).onchange = draw);
$("anim").oninput = () => { stopPlay(); draw(); };
let playing = null;
function stopPlay(){ if(playing){ cancelAnimationFrame(playing); playing = null; $("play").textContent = "▶"; } }
$("play").onclick = () => {
  if(playing){ stopPlay(); return; }
  if(+$("anim").value >= 1000) $("anim").value = 0;
  $("play").textContent = "❚❚";
  const step = () => {
    const v = Math.min(1000, +$("anim").value + 4); $("anim").value = v; draw();
    if(v < 1000) playing = requestAnimationFrame(step); else stopPlay();
  };
  playing = requestAnimationFrame(step);
};

// view switching
function setView(v){
  S.view = v;
  document.querySelectorAll("#viewSeg button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  const img = v !== "plot";
  $("imgView").style.display = img ? "flex" : "none";
  view.style.display = img ? "none" : "block";
  if(S.result){
    const t = S.result.images.target, s = S.result.images.simulation;
    $("imgTarget").src = t || ""; $("imgTarget").parentElement.style.display = t ? "flex" : "none";
    $("imgSim").src = s || ""; $("imgSim").parentElement.style.display = (s && v === "sim") ? "flex" : "none";
    if(v === "sim" && !s) $("imgTarget").parentElement.querySelector("figcaption").textContent = "target (no simulation for this style)";
    else $("imgTarget").parentElement.querySelector("figcaption").textContent = "target (what we aim for)";
  }
  if(!img) draw();
}
document.querySelectorAll("#viewSeg button").forEach(b => b.onclick = () => setView(b.dataset.view));

buildControls();
new ResizeObserver(() => S.result ? draw() : null).observe($("stage"));
</script>
</body>
</html>
